services:
  - type: web
    name: themegram
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CHANNEL_URL
        sync: false
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_URL
        value: https://ykekzvqooicvkwdvqdnc.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: WEBHOOK_PATH
        value: /telegram/webhook
